[project]
name = "trading-assistant"
version = "0.1.0"
description = "Local-first, human-in-the-loop trading research & recommendation assistant (Phase 1: research)."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.1",
    "pandas-market-calendars>=4.4",
    "requests>=2.32",
    "pyarrow>=17",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ta_research"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
