name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff) -- informational until tree confirmed clean
        run: uv run ruff check .
        continue-on-error: true

      - name: Type-check (mypy) -- informational; third-party stubs still noisy
        run: uv run mypy src
        continue-on-error: true

      - name: Tests (HARD GATE)
        run: uv run pytest -q
